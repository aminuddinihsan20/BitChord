name: Release

# Pushing a new version builds it and publishes it, with no button to press.
#
# On every push to rust-2.0 the `plan` job reads the version in Cargo.toml. If that
# version has no release yet (tag v<version>), it is released: the platforms listed in
# .github/release-notes/v<version>.platforms (words: windows linux macos android; all of
# them when the file is missing) are built, their files are attached, and the release is
# published at once with .github/release-notes/v<version>.md as its notes. A push that
# doesn't change the version builds nothing, and a platform that isn't listed gets no job.
# Pushing a v* tag by hand, or running this workflow by hand, does the same for that tag
# (by hand, each platform is a switch).
on:
  push:
    branches: [rust-2.0]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows:
        description: Build Windows
        type: boolean
        default: true
      linux:
        description: Build Linux
        type: boolean
        default: true
      macos:
        description: Build macOS
        type: boolean
        default: true
      android:
        description: Build Android
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Decides whether this push is a release, and which platforms it builds.
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.p.outputs.release }}
      tag: ${{ steps.p.outputs.tag }}
      windows: ${{ steps.p.outputs.windows }}
      linux: ${{ steps.p.outputs.linux }}
      macos: ${{ steps.p.outputs.macos }}
      android: ${{ steps.p.outputs.android }}
    steps:
      - uses: actions/checkout@v5

      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_WINDOWS: ${{ inputs.windows }}
          INPUT_LINUX: ${{ inputs.linux }}
          INPUT_MACOS: ${{ inputs.macos }}
          INPUT_ANDROID: ${{ inputs.android }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$REF_TYPE" = tag ]; then tag=$REF_NAME; else tag="v$version"; fi
          release=true
          # A push to the branch that leaves the version alone is not a release.
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            release=false
          fi
          list=".github/release-notes/$tag.platforms"
          for p in windows linux macos android; do
            if [ "$release" = false ]; then on=false
            elif [ "$EVENT" = workflow_dispatch ]; then
              [ "$(printenv "INPUT_$(echo "$p" | tr a-z A-Z)")" = true ] && on=true || on=false
            elif [ -f "$list" ]; then
              grep -qw "$p" "$list" && on=true || on=false
            else on=true; fi
            echo "$p=$on" >> "$GITHUB_OUTPUT"
          done
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release tag=$tag"

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Check versions match
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          iss_ver=$(grep -m1 '#define AppVersion' installer/bitchord.iss | cut -d'"' -f2)
          echo "Cargo.toml $cargo_ver, bitchord.iss $iss_ver"
          [ "$cargo_ver" = "$iss_ver" ] || { echo "version mismatch"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$cargo_ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match v$cargo_ver"; exit 1
          fi
          echo "VERSION=$cargo_ver" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked

      # Cross-compiled on the x64 runner, whose Visual Studio has the ARM64 tools.
      - name: Build ARM64
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

      # webview2-com-sys extracts WebView2Loader.dll into its build OUT_DIR rather than
      # next to the exe; the installer expects it in BinDir, so copy it there per arch.
      # The build tree is searched by shape, not by package hash, and the crate's own
      # vendored copy is the fallback, so neither a layout change nor a pruned cache
      # can strand the installer step looking for a file that was never placed.
      - name: Stage WebView2Loader.dll
        run: |
          foreach ($t in @(@{ bin = "target\release"; arch = "x64" }, @{ bin = "target\aarch64-pc-windows-msvc\release"; arch = "arm64" })) {
            $dll = Get-ChildItem -Path "$($t.bin)\build\*\out\$($t.arch)\WebView2Loader.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dll) { $dll = Get-ChildItem -Path "$HOME\.cargo\registry\src\*\webview2-com-sys-*\$($t.arch)\WebView2Loader.dll" -ErrorAction SilentlyContinue | Select-Object -First 1 }
            if (-not $dll) {
              Get-ChildItem -Path "$($t.bin)\build" -Filter "webview2*" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                Get-ChildItem -Path $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { Write-Host "saw: $($_.FullName)" }
              }
              Write-Error "WebView2Loader.dll ($($t.arch)) not found under $($t.bin)\build"; exit 1
            }
            Copy-Item $dll.FullName "$($t.bin)\WebView2Loader.dll" -Force
            Write-Host "staged $($dll.FullName) -> $($t.bin)\WebView2Loader.dll"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\bitchord.iss
          if ($LASTEXITCODE) { exit 1 }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DArm64 installer\bitchord.iss
          if ($LASTEXITCODE) { exit 1 }

      # The portable zips: the exe, the marker that makes it portable, README and LICENSE.
      - name: Build portable zips
        run: |
          foreach ($b in @(@{ dir = "target\release"; suffix = "" }, @{ dir = "target\aarch64-pc-windows-msvc\release"; suffix = "-arm64" })) {
            $out = "installer\Output\portable$($b.suffix)"
            New-Item -ItemType Directory -Force $out | Out-Null
            Copy-Item "$($b.dir)\bitchord.exe", installer\portable.txt, README.md, LICENSE $out
            & "$env:SystemRoot\System32\tar.exe" -a -c -f "installer\Output\bitchord-portable-$env:VERSION$($b.suffix).zip" -C $out bitchord.exe portable.txt README.md LICENSE
            if ($LASTEXITCODE) { exit 1 }
          }

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            installer/Output/bitchord-setup-${{ env.VERSION }}.exe
            installer/Output/bitchord-portable-${{ env.VERSION }}.zip
            installer/Output/bitchord-setup-${{ env.VERSION }}-arm64.exe
            installer/Output/bitchord-portable-${{ env.VERSION }}-arm64.zip
          if-no-files-found: error

  linux:
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev

      - name: Build
        run: |
          cargo build --release --locked
          echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      # The installer tarball: the binary, install.sh with the launcher and icon it
      # installs, README and LICENSE. The portable one: the binary, the marker that makes
      # it portable, README and LICENSE. The updater on Linux reads them too.
      - name: Build tarballs
        run: |
          dir="bitchord-$VERSION-linux-x86_64"
          mkdir -p "out/$dir"
          cp target/release/bitchord linux/install.sh linux/bitchord.desktop README.md LICENSE "out/$dir/"
          cp assets/icon/icon.png "out/$dir/bitchord.png"
          chmod 755 "out/$dir/bitchord" "out/$dir/install.sh"
          tar -czf "out/$dir.tar.gz" -C out "$dir"
          dir="bitchord-portable-$VERSION-linux-x86_64"
          mkdir -p "out/$dir"
          cp target/release/bitchord linux/portable.txt README.md LICENSE "out/$dir/"
          chmod 755 "out/$dir/bitchord"
          tar -czf "out/$dir.tar.gz" -C out "$dir"

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: |
            out/bitchord-${{ env.VERSION }}-linux-x86_64.tar.gz
            out/bitchord-portable-${{ env.VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # The tests run on the Apple silicon runner itself; a release isn't published
      # without them passing.
      - name: Test
        run: cargo test --locked --target aarch64-apple-darwin

      # The Intel build is cross-compiled on the Apple silicon runner.
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      # Per architecture, the installer: a disk image with the app and an Applications
      # link to drag it to. And the portable zip: the app with the portable marker,
      # README and LICENSE. The updater on macOS reads them too.
      - name: Build installers and portable zips
        run: |
          for arch in aarch64 x86_64; do
            bin="target/$arch-apple-darwin/release/bitchord"
            stage="out/dmg-$arch"
            dmg="out/bitchord-setup-$VERSION-macos-$arch.dmg"
            mkdir -p "$stage"
            sh macos/bundle.sh "$bin" "$VERSION" "$stage"
            ln -s /Applications "$stage/Applications"
            # hdiutil on the hosted runners sometimes fails with "Resource busy"; retry.
            for try in 1 2 3; do
              hdiutil create -volname "BitChord" -srcfolder "$stage" -ov -format UDZO "$dmg" && break
              sleep 10
            done
            [ -f "$dmg" ]
            dir="bitchord-portable-$VERSION-macos-$arch"
            mkdir -p "out/$dir"
            sh macos/bundle.sh "$bin" "$VERSION" "out/$dir" portable
            cp README.md LICENSE "out/$dir/"
            ditto -c -k --norsrc --keepParent "out/$dir" "out/$dir.zip"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: |
            out/bitchord-setup-${{ env.VERSION }}-macos-aarch64.dmg
            out/bitchord-portable-${{ env.VERSION }}-macos-aarch64.zip
            out/bitchord-setup-${{ env.VERSION }}-macos-x86_64.dmg
            out/bitchord-portable-${{ env.VERSION }}-macos-x86_64.zip
          if-no-files-found: error

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to commits: this job handles the signing key.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # bindgen (rquickjs's Android bindings) needs libclang.
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          echo "LIBCLANG_PATH=$(llvm-config --libdir 2>/dev/null || dirname "$(find /usr/lib -name 'libclang*.so*' | head -1)")" >> "$GITHUB_ENV"

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" "platforms;android-36" "build-tools;36.1.0"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Check versions match
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          apk_ver=$(grep -m1 'versionName' android/app/build.gradle.kts | cut -d'"' -f2)
          echo "Cargo.toml $cargo_ver, android $apk_ver"
          [ "$cargo_ver" = "$apk_ver" ] || { echo "version mismatch"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$cargo_ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match v$cargo_ver"; exit 1
          fi
          echo "VERSION=$cargo_ver" >> "$GITHUB_ENV"

      # Signed with the project's key when the four secrets exist; otherwise with the
      # debug key (installs, but a later build can't update it).
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::no signing key: the APK is signed with the debug key"
          fi
          sh android/build.sh release

      # The key is on the runner's disk only while the APK is built.
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/bitchord-$VERSION-android-arm64.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: out/bitchord-${{ env.VERSION }}-android-arm64.apk
          if-no-files-found: error

  attach:
    needs: [plan, windows, linux, macos, android]
    # Whatever was built (a platform left out is skipped, not a failure); nothing if one failed.
    if: needs.plan.outputs.release == 'true' && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true

      # The release is published here, once every file is on it, with its notes: the app's
      # updater reads the latest published release, so it never sees one half built.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          ls -l files
          [ -n "$(ls -A files 2>/dev/null)" ] || { echo "nothing was built"; exit 1; }
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then notes_args="--notes-file $notes"; else notes_args="--generate-notes"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
            gh release edit "$TAG" --draft=false --latest --title "bitchord ${TAG#v}" $notes_args
          else
            # --target makes the tag at this commit when it doesn't exist yet.
            gh release create "$TAG" files/* --target "$GITHUB_SHA" --latest --title "bitchord ${TAG#v}" $notes_args
          fi
          gh release view "$TAG" --json url,isDraft --jq '"\(.url) draft=\(.isDraft)"'
